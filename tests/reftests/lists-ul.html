<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Unordered lists</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 16px; }
  .col { float: left; width: 230px; margin-right: 20px; background: #f8f9fa; border-top: 4px solid #4361ee; }
  .disc { list-style-type: disc; }
  .circle { list-style-type: circle; color: #b5179e; }
  .square { list-style-type: square; color: #3a0ca3; }
  .none { list-style: none; padding-left: 10px; }
  li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="col">
  <ul class="disc"><li>Disc bullets</li><li>Second item</li><li>Third item that is long enough to wrap onto a second line</li></ul>
  <ul><li>Default nesting<ul><li>Circle level</li><li>Another<ul><li>Square level</li></ul></li></ul></li></ul>
</div>
<div class="col">
  <ul class="circle"><li>Circle bullets</li><li>Colored</li></ul>
  <ul class="square"><li>Square bullets</li><li>Also colored</li></ul>
</div>
<div class="col">
  <ul class="none"><li>No markers</li><li>Plain items</li></ul>
  <ul style="font-size: 24px"><li>Bigger</li><li>Bullets</li></ul>
</div>
</body>
</html>
