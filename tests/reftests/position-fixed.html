<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>position: fixed</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 0; font-size: 16px; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #1d3557; color: #fff; line-height: 50px; padding-left: 20px; }
  .rel { position: relative; margin: 80px 40px; width: 300px; height: 200px; background: #a8dadc; }
  /* fixed ignores the relatively positioned ancestor */
  .fx { position: fixed; bottom: 20px; right: 20px; width: 120px; height: 80px; background: #e63946; }
  .ab { position: absolute; bottom: 20px; right: 20px; width: 120px; height: 80px; background: #457b9d; }
  .badge { position: fixed; left: 20px; bottom: 20px; padding: 8px 14px; background: #2a9d8f; color: #fff; }
</style>
</head>
<body>
<header>Fixed header</header>
<div class="rel">
  <div class="ab"></div>
  <div class="fx"></div>
</div>
<div class="badge">Fixed badge</div>
</body>
</html>
