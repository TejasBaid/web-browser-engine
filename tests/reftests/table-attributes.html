<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tables: presentational attributes</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 14px; }
</style>
</head>
<body>
<table width="85%" bgcolor="#f6f6ef" cellpadding="0" cellspacing="0">
  <tr><td bgcolor="#ff6600" height="30"><b>&nbsp;Header bar with bgcolor</b></td></tr>
  <tr><td height="10"></td></tr>
  <tr><td>
    <table cellpadding="4" cellspacing="2" bgcolor="#cccccc">
      <tr><td bgcolor="#ffffff" width="120">width=120</td><td bgcolor="#ffffff">cellpadding=4</td><td bgcolor="#ffffff" align="right">align=right</td></tr>
      <tr><td bgcolor="#ffffff" valign="top">valign=top</td><td bgcolor="#ffffff" height="60">height=60</td><td bgcolor="#ffffff" valign="bottom">valign=bottom</td></tr>
    </table>
  </td></tr>
  <tr><td height="10"></td></tr>
  <tr><td>
    <table width="100%" cellspacing="0" cellpadding="6">
      <tr><td bgcolor="#264653" width="30%"><font color="#ffffff">30%</font></td><td bgcolor="#2a9d8f"><font color="#ffffff">auto</font></td><td bgcolor="#e9c46a" width="100">100px</td></tr>
    </table>
  </td></tr>
</table>
<br>
<table border="0" cellpadding="8" cellspacing="4" bgcolor="#1d3557" align="center">
  <tr><td bgcolor="#e63946" colspan="3" align="center"><font color="#ffffff">centered table, colspan=3</font></td></tr>
  <tr><td bgcolor="#f1faee">1</td><td bgcolor="#a8dadc">2</td><td bgcolor="#f1faee">3</td></tr>
</table>
</body>
</html>
