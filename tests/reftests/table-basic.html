<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tables: basic layout</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 15px; }
  table { border: 2px solid #1d3557; margin-bottom: 20px; }
  th { background: #1d3557; color: #fff; padding: 6px 12px; }
  td { background: #f1faee; padding: 6px 12px; }
  tr:nth-child(even) td { background: #a8dadc; }
  .spacing { border-spacing: 8px; background: #e63946; }
  .spacing td { background: #fff; }
  .wide { width: 600px; }
  .wide td.num { text-align: right; }
  .span td { border: 1px solid #333; background: #ffd166; }
</style>
</head>
<body>
<table>
  <tr><th>Name</th><th>Language</th><th>Year</th></tr>
  <tr><td>Servo</td><td>Rust</td><td>2012</td></tr>
  <tr><td>WebKit</td><td>C++</td><td>2001</td></tr>
  <tr><td>Gecko</td><td>C++ / Rust</td><td>1997</td></tr>
</table>
<table class="spacing">
  <tr><td>A</td><td>B</td><td>C</td></tr>
  <tr><td>D</td><td>E</td><td>F</td></tr>
</table>
<table class="wide">
  <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
  <tr><td>Widget</td><td class="num">3</td><td class="num">4.50</td></tr>
  <tr><td>A much longer item description</td><td class="num">12</td><td class="num">120.00</td></tr>
</table>
<table class="span">
  <tr><td colspan="2">colspan=2</td><td>c</td></tr>
  <tr><td>a</td><td>b</td><td>c</td></tr>
  <tr><td>a</td><td colspan="2">colspan=2 again</td></tr>
</table>
</body>
</html>
