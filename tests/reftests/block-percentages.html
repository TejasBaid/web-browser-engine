<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Percentage widths and padding</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 0; }
  .outer { width: 600px; margin: 20px; background: #1d3557; padding: 10px; }
  .p25 { width: 25%; height: 40px; background: #e63946; }
  .p50 { width: 50%; height: 40px; background: #f4a261; }
  .p100 { width: 100%; height: 40px; background: #2a9d8f; }
  .pad { width: 50%; padding: 5%; background: #a8dadc; }
  .pad div { width: 50%; height: 30px; background: #6a4c93; }
  .hpct { height: 120px; background: #8ecae6; }
  .hpct div { height: 50%; width: 30%; background: #fb8500; }
</style>
</head>
<body>
<div class="outer">
  <div class="p25"></div>
  <div class="p50"></div>
  <div class="p100"></div>
  <div class="pad"><div></div></div>
  <div class="hpct"><div></div></div>
</div>
</body>
</html>
