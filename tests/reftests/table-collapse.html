<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tables: collapsing borders</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 14px; }
  table { border-collapse: collapse; margin-bottom: 24px; }
  .wiki { border: 1px solid #a2a9b1; background: #f8f9fa; }
  .wiki th, .wiki td { border: 1px solid #a2a9b1; padding: 4px 10px; }
  .wiki th { background: #eaecf0; }
  .thick td { border: 3px solid #1d3557; width: 40px; height: 24px; text-align: center; }
  .thick td.red { border-right: 8px solid #e63946; }
  .thick td.green { border-bottom: 6px solid #2a9d8f; }
  .outer { border: 6px solid #f4a261; }
  .outer td { border: 2px solid #264653; padding: 6px 14px; }
  .span td { border: 2px solid #457b9d; padding: 6px; }
</style>
</head>
<body>
<table class="wiki">
  <tr><th>Engine</th><th>Browser</th><th>Language</th></tr>
  <tr><td>Blink</td><td>Chrome</td><td>C++</td></tr>
  <tr><td>Gecko</td><td>Firefox</td><td>C++ / Rust</td></tr>
  <tr><td>WebKit</td><td>Safari</td><td>C++</td></tr>
</table>
<table class="thick">
  <tr><td>1</td><td class="red">2</td><td>3</td></tr>
  <tr><td class="green">4</td><td>5</td><td>6</td></tr>
</table>
<table class="outer">
  <tr><td>outer</td><td>border</td></tr>
  <tr><td>wins</td><td>here</td></tr>
</table>
<table class="span">
  <tr><td colspan="2">colspan 2</td><td rowspan="2">rowspan</td></tr>
  <tr><td>a</td><td>b</td></tr>
</table>
</body>
</html>
