<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>@media width queries</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 15px; }
  div { height: 40px; line-height: 40px; padding-left: 10px; margin-bottom: 8px; width: 500px; color: #fff; background: #e63946; }
  /* Viewport is 800px wide: every row should turn green. */
  @media (min-width: 600px) { .a { background: #2a9d8f; } }
  @media (max-width: 600px) { .b { background: #e63946; } }
  @media (min-width: 900px) { .b { background: #e63946; } }
  .b { background: #2a9d8f; }
  @media screen and (min-width: 700px) and (max-width: 900px) { .c { background: #2a9d8f; } }
  @media print { .d { background: #e63946 !important; } }
  .d { background: #2a9d8f; }
  @media (max-width: 400px), (min-width: 780px) { .e { background: #2a9d8f; } }
  @media not print { .f { background: #2a9d8f; } }
  @media (width >= 800px) { .g { background: #2a9d8f; } }
  @media all and (orientation: landscape) { .h { background: #2a9d8f; } }
</style>
</head>
<body>
<div class="a">(min-width: 600px)</div>
<div class="b">(max-width: 600px) does not apply</div>
<div class="c">screen and (min-width: 700px) and (max-width: 900px)</div>
<div class="d">print does not apply</div>
<div class="e">(max-width: 400px), (min-width: 780px)</div>
<div class="f">not print</div>
<div class="g">(width &gt;= 800px)</div>
<div class="h">(orientation: landscape)</div>
</body>
</html>
