<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Color syntaxes</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 13px; background: #ffffff; }
  .grid { overflow: hidden; }
  .sw { float: left; width: 120px; height: 70px; margin: 0 10px 10px 0; border: 1px solid #000; }
  .sw span { display: block; background: #fff; padding: 2px 4px; font-family: "Liberation Mono"; font-size: 11px; }
  .stripes { height: 40px; background: #000; padding: 10px; }
  .stripes div { float: left; width: 80px; height: 40px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw" style="background: tomato"><span>tomato</span></div>
  <div class="sw" style="background: rebeccapurple"><span>rebeccapurple</span></div>
  <div class="sw" style="background: #0a0"><span>#0a0</span></div>
  <div class="sw" style="background: #1e90ff"><span>#1e90ff</span></div>
  <div class="sw" style="background: #ff000080"><span>#ff000080</span></div>
  <div class="sw" style="background: #f0f8"><span>#f0f8</span></div>
  <div class="sw" style="background: rgb(255, 165, 0)"><span>rgb()</span></div>
  <div class="sw" style="background: rgba(0, 0, 255, 0.3)"><span>rgba()</span></div>
  <div class="sw" style="background: rgb(10 200 120)"><span>rgb space</span></div>
  <div class="sw" style="background: hsl(200, 80%, 50%)"><span>hsl()</span></div>
  <div class="sw" style="background: hsla(330, 90%, 45%, 0.6)"><span>hsla()</span></div>
  <div class="sw" style="background: hsl(60 100% 50%)"><span>hsl space</span></div>
  <div class="sw" style="background: transparent"><span>transparent</span></div>
  <div class="sw" style="background: darkslategray"><span>darkslategray</span></div>
  <div class="sw" style="background: GOLD"><span>GOLD</span></div>
  <div class="sw" style="color: #c00; background: currentColor"><span>currentColor</span></div>
</div>
<div class="stripes">
  <div style="background: rgba(255,255,255,0.1)"></div>
  <div style="background: rgba(255,255,255,0.3)"></div>
  <div style="background: rgba(255,255,255,0.5)"></div>
  <div style="background: rgba(255,255,255,0.7)"></div>
  <div style="background: rgba(255,255,255,0.9)"></div>
  <div style="background: hsl(0, 100%, 50%)"></div>
  <div style="background: hsl(120, 100%, 25%)"></div>
  <div style="background: hsl(240, 100%, 50%)"></div>
</div>
</body>
</html>
