<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>box-sizing</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; }
  .box { width: 300px; height: 80px; padding: 20px; border: 10px solid #1d3557; margin-bottom: 16px; }
  .content { box-sizing: content-box; background: #e9c46a; }
  .border { box-sizing: border-box; background: #2a9d8f; }
  .ruler { width: 300px; height: 8px; background: #e63946; margin-bottom: 16px; }
  .pair { overflow: hidden; width: 400px; background: #ddd; margin-bottom: 16px; }
  .pair div { float: left; box-sizing: border-box; width: 50%; height: 60px; border: 8px solid #264653; }
  .pair div + div { background: #f4a261; border-color: #9b2226; }
</style>
</head>
<body>
<div class="ruler"></div>
<div class="box content"></div>
<div class="box border"></div>
<div class="pair"><div></div><div></div></div>
</body>
</html>
