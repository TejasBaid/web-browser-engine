<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flexbox: flex-wrap and align-content</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; }
  .f { display: flex; width: 340px; background: #e9ecef; border: 2px solid #343a40; margin: 0 20px 20px 0; float: left; }
  .f div { width: 90px; height: 40px; margin: 4px; }
  .f div:nth-child(4n+1) { background: #e63946; }
  .f div:nth-child(4n+2) { background: #f4a261; }
  .f div:nth-child(4n+3) { background: #2a9d8f; }
  .f div:nth-child(4n+4) { background: #457b9d; }
  .nowrap { flex-wrap: nowrap; }
  .wrap { flex-wrap: wrap; }
  .wrapr { flex-wrap: wrap-reverse; }
  .tall { height: 170px; align-content: center; flex-wrap: wrap; }
  .between { height: 170px; align-content: space-between; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="f nowrap"><div></div><div></div><div></div><div></div><div></div></div>
<div class="f wrap"><div></div><div></div><div></div><div></div><div></div></div>
<div class="f wrapr"><div></div><div></div><div></div><div></div><div></div></div>
<div class="f tall"><div></div><div></div><div></div><div></div><div></div></div>
<div class="f between"><div></div><div></div><div></div><div></div><div></div></div>
</body>
</html>
