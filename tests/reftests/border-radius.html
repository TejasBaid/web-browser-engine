<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>border-radius</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; }
  .r { float: left; width: 140px; height: 90px; margin: 0 20px 20px 0; background: #2a9d8f; }
  .r1 { border-radius: 10px; }
  .r2 { border-radius: 30px; background: #e76f51; }
  .r3 { border-radius: 50%; width: 90px; height: 90px; margin-right: 70px; background: #264653; }
  .r4 { border-radius: 0 40px 0 40px; background: #e9c46a; }
  .r5 { border-radius: 20px; border: 8px solid #1d3557; background: #a8dadc; }
  .r6 { border-radius: 45px; border: 12px solid #6a4c93; background: #fff; }
  .r7 { border-top-left-radius: 60px; border-bottom-right-radius: 20px; background: #f4a261; }
  .r8 { border-radius: 16px; border: 6px solid; border-color: #e63946 #457b9d; background: #f1faee; }
  .pill { float: left; clear: left; padding: 8px 24px; border-radius: 999px; background: #3a86ff; color: #fff; font-size: 18px; margin-right: 12px; }
</style>
</head>
<body>
<div class="r r1"></div>
<div class="r r2"></div>
<div class="r r3"></div>
<div class="r r4"></div>
<div class="r r5"></div>
<div class="r r6"></div>
<div class="r r7"></div>
<div class="r r8"></div>
<div class="pill">Pill button</div>
</body>
</html>
