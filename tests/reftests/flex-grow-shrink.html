<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flexbox: flex-grow, flex-shrink, flex-basis</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 13px; }
  .label { font-family: "Liberation Mono"; margin: 0 0 2px; }
  .f { display: flex; width: 600px; height: 40px; background: #e9ecef; border: 1px solid #343a40; margin-bottom: 12px; }
  .f div { height: 40px; }
  .f div:nth-child(1) { background: #e63946; }
  .f div:nth-child(2) { background: #2a9d8f; }
  .f div:nth-child(3) { background: #457b9d; }
  .f div:nth-child(4) { background: #f4a261; }
</style>
</head>
<body>
<p class="label">flex-grow 1 / 1 / 1</p>
<div class="f"><div style="flex-grow:1"></div><div style="flex-grow:1"></div><div style="flex-grow:1"></div></div>
<p class="label">flex-grow 1 / 2 / 3</p>
<div class="f"><div style="flex-grow:1"></div><div style="flex-grow:2"></div><div style="flex-grow:3"></div></div>
<p class="label">fixed 100px + grow 1 + fixed 150px</p>
<div class="f"><div style="width:100px"></div><div style="flex:1"></div><div style="width:150px"></div></div>
<p class="label">flex-basis 200px, shrink 1 / 1 / 3 (overflowing 800px into 600px)</p>
<div class="f"><div style="flex: 0 1 200px"></div><div style="flex: 0 1 300px"></div><div style="flex: 0 3 300px"></div></div>
<p class="label">flex-shrink 0 overflows</p>
<div class="f" style="width: 400px"><div style="flex: 0 0 200px"></div><div style="flex: 0 0 150px"></div><div style="flex: 0 0 150px"></div></div>
<p class="label">flex: 1 1 0 with max-width on item 2</p>
<div class="f"><div style="flex:1 1 0"></div><div style="flex:1 1 0; max-width: 80px"></div><div style="flex:1 1 0"></div><div style="flex:2 1 0"></div></div>
<p class="label">flex: auto with min-width</p>
<div class="f"><div style="flex:auto; width: 50px"></div><div style="flex:auto; width: 150px; min-width: 250px"></div><div style="flex: none; width: 60px"></div></div>
</body>
</html>
