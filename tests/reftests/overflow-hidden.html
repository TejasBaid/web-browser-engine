<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overflow: hidden clipping</title>
<link rel="stylesheet" href="reftest.css">
<style>
  body { margin: 20px; font-size: 16px; }
  .row { overflow: hidden; margin-bottom: 40px; }
  .clip { float: left; width: 180px; height: 120px; margin-right: 30px; border: 6px solid #1d3557; background: #f1faee; padding: 10px; }
  .hidden { overflow: hidden; }
  .big { width: 300px; height: 200px; background: #e63946; }
  .vis { height: 60px; }
  .vis .big { height: 90px; width: 240px; background: rgba(69, 123, 157, 0.7); }
  .absclip { position: relative; overflow: hidden; }
  .absclip div { position: absolute; left: 130px; top: 80px; width: 120px; height: 120px; background: #2a9d8f; }
  .text { width: 220px; height: 60px; overflow: hidden; background: #ffd166; padding: 6px; float: left; margin-right: 50px; }
  .nested { width: 220px; height: 100px; overflow: hidden; border: 4px solid #6a4c93; float: left; }
  .nested div { margin: 20px 0 0 40px; width: 260px; height: 140px; background: #8ecae6; border: 6px solid #023047; }
</style>
</head>
<body>
<div class="row">
  <div class="clip hidden"><div class="big"></div></div>
  <div class="clip absclip"><div></div></div>
  <div class="clip vis"><div class="big"></div></div>
</div>
<div class="row">
  <div class="text">This paragraph is longer than its fixed-height box, so the overflowing lines are clipped away.</div>
  <div class="nested"><div></div></div>
</div>
</body>
</html>
